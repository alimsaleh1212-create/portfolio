name: ali-portfolio

x-backend-build: &backend-build
  context: ./backend
  target: prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO's official images are no longer published (the Docker Hub and Quay
  # repositories are gone or denied), so use Chainguard's maintained builds,
  # pinned by digest. Both run as uid 65532 with the binary as entrypoint.
  minio:
    image: cgr.dev/chainguard/minio@sha256:6a1d0b45c8669726bba580ced0bfa4cb9fdeed1ed636dfabd81d1577beb6937b
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?copy .env.example to .env}
    volumes:
      - minio_data:/data
    healthcheck:
      # The image has no curl or wget, so speak HTTP through bash.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r status <&3 && [[ $$status == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: creates the media bucket, then exits. No healthcheck because
  # it is not a long-running service; dependants wait for successful completion.
  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:b2bd7824d23d3e3b15bedd7e87fbc3be29d2e213307b4f901e4a1d92356dc20f
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # mc reads this alias from the environment, so no shell is needed. The
      # credentials sit in a URL, so keep them free of characters such as @ / :
      MC_HOST_local: http://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}@minio:9000
    command: ["mb", "--ignore-existing", "local/${MINIO_BUCKET:-portfolio-media}"]
    restart: "no"

  # One-shot job: applies Alembic migrations, then exits.
  migrate:
    build: *backend-build
    image: ali-portfolio-api
    command: ["alembic", "upgrade", "head"]
    environment: &api-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-portfolio-media}
      HEALTH_CHECK_TIMEOUT_SECONDS: ${HEALTH_CHECK_TIMEOUT_SECONDS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Response cache: an expiry that is only a safety net (the seed invalidates),
      # and the longest a cache read or write may take. Metrics are served on
      # their own port, unpublished and never proxied by Caddy.
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      CACHE_TIMEOUT_SECONDS: ${CACHE_TIMEOUT_SECONDS:-0.25}
      CACHE_RETRY_SECONDS: ${CACHE_RETRY_SECONDS:-5}
      METRICS_PORT: ${METRICS_PORT:-9100}
      # Where to send traces (OTLP over HTTP). Empty, nothing is exported and
      # nothing tries to connect. With the observability profile on, set it to
      # http://collector:4318 (see .env.example).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Contact message delivery by email. Off unless SMTP_HOST, MAIL_SENDER and
      # MAIL_RECIPIENT are all set (see .env.example).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      MAIL_SENDER: ${MAIL_SENDER:-}
      MAIL_RECIPIENT: ${MAIL_RECIPIENT:-}
      # Contact messages accepted per client per hour.
      CONTACT_LIMIT_PER_HOUR: ${CONTACT_LIMIT_PER_HOUR:-3}
      # Where the content files are mounted inside the container.
      CONTENT_DIR: /content
      # Where the media folder is mounted inside the seed container.
      MEDIA_SOURCE_DIR: /media-source
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot job: loads the text content into Postgres and prepares the media
  # into MinIO, then exits. Runs in non-strict mode so a fresh stack always
  # comes up, with placeholders and without media files that are not there.
  # By hand: docker compose run --rm seed python -m app.seed [--strict]
  seed:
    build:
      context: ./backend
      target: seed
    image: ali-portfolio-seed
    command: ["python", "-m", "app.seed"]
    environment: *api-environment
    volumes: &content-volume
      - ./content:/content:ro
      # The source photograph, video and PDF. MEDIA_DIR must exist on the host
      # (the clone ships ./my_docs); Docker would create a missing one as root.
      - ${MEDIA_DIR:-./my_docs}:/media-source:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      # The seed invalidates the API's response cache in Redis when it finishes.
      redis:
        condition: service_healthy
    restart: "no"

  api:
    build: *backend-build
    image: ali-portfolio-api
    environment: *api-environment
    # The API itself does not read the files; the test suite run in this
    # container does, to check the real content.
    volumes: *content-volume
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      # Only when the observability profile is on, so the first spans have
      # somewhere to go. With the profile off this line is ignored.
      collector:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10

  # Serves the built frontend (baked into the image) and proxies /api/ to the API.
  caddy:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    image: ali-portfolio-caddy
    environment:
      # Caddy serves the bucket's objects under /media/.
      MINIO_BUCKET: ${MINIO_BUCKET:-portfolio-media}
    ports:
      - "${CADDY_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/caddy-health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # Observability profile (optional): docker compose --profile observability up
  # Metrics (Prometheus), logs (Loki), traces (Tempo), one collector (Alloy)
  # and Grafana. Only Grafana is published, on localhost, never through Caddy.
  # Every image is pinned to a version and every container has a memory limit.
  # Retention: metrics 7 days, logs 7 days, traces 3 days.
  # ---------------------------------------------------------------------------

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-lifecycle=false
    environment:
      GOMEMLIMIT: 200MiB
    mem_limit: 256m
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10

  loki:
    profiles: [observability]
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    environment:
      GOMEMLIMIT: 250MiB
    mem_limit: 320m
    volumes:
      - ./infra/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  tempo:
    profiles: [observability]
    image: grafana/tempo:3.1.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    environment:
      GOMEMLIMIT: 250MiB
    mem_limit: 320m
    volumes:
      - ./infra/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Lets the collector list and read containers' logs without the power to
  # start, stop or create them: the Docker socket is mounted here only,
  # read-only, and only GET requests for containers and networks pass.
  docker-proxy:
    profiles: [observability]
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      POST: 0
    mem_limit: 32m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # The one collector: ships this project's container logs to Loki and receives
  # the API's traces for Tempo.
  collector:
    profiles: [observability]
    image: grafana/alloy:v1.20.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-ali-portfolio}
      GOMEMLIMIT: 150MiB
    mem_limit: 192m
    volumes:
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - collector_data:/var/lib/alloy/data
    depends_on:
      docker-proxy:
        condition: service_started
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/alloy", "--version"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-shot job that Grafana waits for. It refuses to go on (exit 1, with the
  # reason in its log) unless GRAFANA_ADMIN_PASSWORD and GRAFANA_DB_PASSWORD are
  # set, so there is never a default password. Then it creates the read-only
  # Postgres role Grafana uses, or updates it on a database that already has
  # it. Safe to run on every start. (A `:?` check in this file would also fire
  # with the profile off, because Compose interpolates every service.)
  grafana-setup:
    profiles: [observability]
    image: postgres:16-alpine
    command: ["sh", "/setup-grafana.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_reader}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
    mem_limit: 64m
    volumes:
      - ./infra/observability/setup-grafana.sh:/setup-grafana.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_MODE: console
      GF_LOG_LEVEL: warn
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/visits-and-progress.json
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_reader}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB}
      GOMEMLIMIT: 250MiB
    mem_limit: 320m
    # Localhost only: reachable from this machine, not from the network.
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      grafana-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  collector_data:
