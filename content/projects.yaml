# The six Projects, in the CV's order. The tagline is the CV's own subtitle.
# A metric is a value and a label, both in the CV's own words (the value is the
# figure, the label says what it measures). A Project with no figure has none listed.
projects:
  - slug: agentic-coding-workflow-automation
    name: Agentic Coding Workflow Automation
    tagline: Claude Code, Codex, opencode
    description: >-
      I orchestrated Claude Code, Codex and opencode agents with scripted phase
      transitions and a worktree-per-feature fan-out, removing manual hand-offs.
      I configured multi-model fallback routing (Claude primary, GLM and Gemini
      fallbacks) so work continues when a provider limit is hit. I run a
      structured, skill-driven engineering workflow in Claude Code on the
      open-source mattpocock/skills pack: requirements grilling against the
      docs, spec writing, implementation planning, prototyping, test-driven
      development, code review and bug diagnosis, tracked in GitHub Issues.
    stack: [Claude Code, Codex, opencode, GLM, Gemini, GitHub Issues]
    metrics: []
  - slug: claude-skills-suite
    name: Claude Skills Suite
    tagline: Reusable AI workflows for a team
    description: >-
      I built six Claude Skills that turn team coding standards into documented,
      repeatable AI workflows covering data exploration, cleaning, feature
      engineering, model training, FastAPI serving and Python guidelines.
    stack: [Claude Skills, FastAPI]
    metrics: []
  - slug: drift-triage-co-pilot
    name: Drift Triage Co-Pilot
    tagline: Self-healing MLOps platform
    description: >-
      I developed a LangGraph supervisor agent that monitors live models for
      data drift (PSI / chi²) and orchestrates retraining and rollback through
      an idempotent Redis queue, sustaining model accuracy above 90%.
    stack: [LangGraph, Redis]
    metrics:
      - value: above 90%
        label: model accuracy sustained
  - slug: argus
    name: Argus
    tagline: AI-driven security automation and response platform (capstone)
    description: >-
      I built a webhook-fed multi-agent pipeline (triage → enrichment →
      response) with human-in-the-loop approvals and a React operations
      dashboard, cutting simulated threat-analysis time by over 80%.
    stack: [React]
    metrics:
      - value: over 80%
        label: cut in simulated threat-analysis time
  - slug: concierge
    name: Concierge
    tagline: Multi-tenant AI SaaS
    description: >-
      I delivered a platform (FastAPI, React, NeMo Guardrails) for deploying
      tool-calling agents with per-tenant isolation, blocking 100% of injection
      and cross-tenant queries in red-team CI.
    stack: [FastAPI, React, NeMo Guardrails]
    metrics:
      - value: 100%
        label: of injection and cross-tenant queries blocked in red-team CI
  - slug: maintainers-copilot
    name: Maintainer's Copilot
    tagline: Embeddable support chatbot
    description: >-
      I created an issue-triage chatbot using hybrid-retrieval RAG and a
      fine-tuned classifier, reaching 92% classification accuracy under
      evaluation-gated CI.
    stack: [RAG]
    metrics:
      - value: 92%
        label: classification accuracy under evaluation-gated CI
