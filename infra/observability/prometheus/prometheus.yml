# Prometheus scrapes the API's metrics endpoint (its own port, inside the
# Compose network, never proxied by Caddy) and itself.
global:
  scrape_interval: 15s
  evaluation_interval: 60s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
