apiVersion: 1

# Every data source has a fixed uid, which the dashboards refer to.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # A log line that carries a trace_id links to that trace in Tempo.
      derivedFields:
        - name: trace_id
          matcherType: regex
          matcherRegex: '"trace_id":\s*"([0-9a-f]{32})"'
          url: '$${__value.raw}'
          urlDisplayLabel: Open trace
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: false
        customQuery: true
        query: '{service="api"} | json | trace_id="$${__trace.traceId}"'
      nodeGraph:
        enabled: false

  # Read-only Postgres user (created by the grafana-db-user job). The password
  # comes from the container's environment.
  - name: Postgres
    uid: postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: $GRAFANA_DB_USER
    editable: false
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
