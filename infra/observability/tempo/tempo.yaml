# Single-process Tempo 2.x on local disk (Tempo 3 needs a Kafka-compatible queue).  Traces are kept for 3 days. Spans arrive
# from the collector over OTLP gRPC; nothing else is exposed.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 72h

usage_report:
  reporting_enabled: false
