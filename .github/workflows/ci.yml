name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same pull request; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-checks:
    name: Backend lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # uv reads backend/.python-version, so the Python version lives in one place.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          working-directory: backend
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  backend-tests:
    name: Backend tests (Postgres, Redis, MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Run through Compose, as the README documents, so CI matches local. A
      # `services:` block cannot pass `server /data` to the pinned Chainguard
      # MinIO image, and Compose also runs migrations and creates the bucket.
      - name: Create .env from the example
        run: cp .env.example .env
      - uses: docker/setup-buildx-action@v3
      - name: Build the dev API image with layer caching
        uses: docker/bake-action@v6
        with:
          source: .
          files: |
            compose.yaml
            compose.dev.yaml
          targets: api
          set: |
            *.cache-from=type=gha,scope=api-dev
            *.cache-to=type=gha,mode=max,scope=api-dev
          load: true
      - name: Run pytest against real services
        run: docker compose -f compose.yaml -f compose.dev.yaml run --rm api pytest
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.dev.yaml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f compose.dev.yaml down -v

  frontend:
    name: Frontend lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
