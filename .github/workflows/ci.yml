name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same pull request; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-checks:
    name: Backend lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # uv reads backend/.python-version, so the Python version lives in one place.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          working-directory: backend
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  observability-config:
    name: Observability profile config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          working-directory: backend
      - run: uv sync --frozen
        working-directory: backend
      # Needs no running stack: Compose is valid with the profile on and off,
      # the provisioning and dashboard files parse, and every dashboard query
      # names a data source that provisioning creates.
      - run: uv run python ../infra/observability/check_config.py
        working-directory: backend

  backend-tests:
    name: Backend tests (Postgres, Redis, MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Run through Compose, as the README documents, so CI matches local. A
      # `services:` block cannot pass `server /data` to the pinned Chainguard
      # MinIO image, and Compose also runs migrations and creates the bucket.
      - name: Create .env from the example
        run: cp .env.example .env
      - uses: docker/setup-buildx-action@v3
      - name: Build the dev API image with layer caching
        uses: docker/bake-action@v6
        with:
          source: .
          files: |
            compose.yaml
            compose.dev.yaml
          targets: api
          set: |
            *.cache-from=type=gha,scope=api-dev
            *.cache-to=type=gha,mode=max,scope=api-dev
          load: true
      - name: Run pytest against real services
        run: docker compose -f compose.yaml -f compose.dev.yaml run --rm api pytest
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.dev.yaml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f compose.dev.yaml down -v

  frontend:
    name: Frontend lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser-tests:
    name: Browser tests (Chromium, built site, real API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example
        run: cp .env.example .env
      # The production images: the built frontend baked into Caddy, the API, and the seed, which
      # stores the Hiker's model and the still pictures (both tracked in content/) in MinIO.
      - uses: docker/setup-buildx-action@v3
      # This builds and runs the one-shot `prerender` job, which Caddy waits for: a pre-render
      # that cannot draw a page fails the stack here, and so the workflow.
      - name: Build and start the stack
        run: docker compose up -d --build --wait
      - name: Check what the pre-render wrote
        run: |
          docker compose logs prerender
          test "$(curl -s localhost:8080/sitemap.xml | grep -c '<loc>')" -ge 8
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/nowhere)" = 404
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the browser tests
        working-directory: frontend
        run: npm run e2e
        env:
          BASE_URL: http://localhost:8080
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
