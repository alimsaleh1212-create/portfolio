# Development mode: `docker compose -f compose.yaml -f compose.dev.yaml up`
# Hot reload for the API (uvicorn --reload) and the frontend (Vite HMR).
services:
  migrate:
    build:
      target: dev

  api:
    build:
      target: dev
    environment:
      RELOAD: "1"
    volumes:
      - ./backend:/app

  frontend:
    image: node:22-alpine
    working_dir: /app
    # Install only when the node_modules volume is empty, so restarts are fast.
    command: sh -c "[ -x node_modules/.bin/vite ] || npm ci; npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      start_period: 300s
      retries: 30

  caddy:
    # Use the stock image with the dev Caddyfile instead of the baked build.
    build: !reset null
    image: caddy:2-alpine
    volumes:
      - ./infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  frontend_node_modules:
