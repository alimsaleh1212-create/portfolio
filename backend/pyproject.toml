[project]
name = "portfolio-backend"
version = "0.1.0"
description = "API for Ali Saleh's portfolio site."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "redis",
    "boto3",
    "structlog",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "pyright",
    "boto3-stubs[s3]",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "D", "N", "SIM"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D"]
"alembic/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["app", "tests", "alembic"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
